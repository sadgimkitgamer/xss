plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ember.music'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ember.music'
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName '3.3'
    }

    // A fixed key is committed so every CI build can be installed over the previous one.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
